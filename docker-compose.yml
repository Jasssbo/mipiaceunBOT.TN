version: '3.9'

services:
  bot:
    build: .
    container_name: mipiaceunbot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy   # Wait for Redis to pass its healthcheck
    networks:
      - botnet
    volumes:
      # Mount env file for credentials
      - ./bot_infos.env:/app/bot_infos.env:ro
      # Persist SQLite database
      - ./users_data.db:/app/users_data.db
      # Persist Pyrogram session (file must exist on host first — see README)
      - ./job_board_bot.session:/app/job_board_bot.session
      # Persist backups
      - ./backups:/app/backups
    env_file:
      - bot_infos.env
    environment:
      TZ: Europe/Rome
      REDIS_URL: redis://redis:6379/0

  redis:
    image: redis:7-alpine
    container_name: mipiaceunbot_redis
    restart: unless-stopped
    networks:
      - botnet
    # Redis port is intentionally NOT published to the host —
    # the bot accesses it via the internal Docker network only.
    volumes:
      - redis_data:/data
    # Persist data across restarts with AOF
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  botnet:
    driver: bridge

volumes:
  redis_data:
